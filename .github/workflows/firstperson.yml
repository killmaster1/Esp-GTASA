name: Build First Person ARM64
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firstperson/**'
      - 'mod/**'
      - '.github/workflows/firstperson.yml'
  pull_request:
    paths:
      - 'firstperson/**'
      - 'mod/**'
      - '.github/workflows/firstperson.yml'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test camera state with simulated game memory
        run: |
          g++ -std=c++14 -D__aarch64__ -Ifirstperson/tests/host -I. firstperson/tests/camera_test.cpp -ldl -o /tmp/headcam-test
          /tmp/headcam-test
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'ndk;27.2.12479018'
      - name: Configure
        run: >-
          cmake -S firstperson -B build-firstperson
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-23
          -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-firstperson --parallel 2
      - uses: actions/upload-artifact@v4
        with:
          name: HeadCam-ARM64
          path: build-firstperson/libheadcam.so
          if-no-files-found: error
