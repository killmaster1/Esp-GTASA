name: Build SA-MP ESP ARM64
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sampesp/**'
      - 'mod/**'
      - '.github/workflows/sampesp.yml'
  pull_request:
    paths:
      - 'sampesp/**'
      - 'mod/**'
      - '.github/workflows/sampesp.yml'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test player selection, clipping and overlay with simulated memory
        run: |
          g++ -std=c++14 -D__aarch64__ -Isampesp/tests/host -I. sampesp/tests/esp_test.cpp -ldl -pthread -o /tmp/sampesp-test
          /tmp/sampesp-test
          g++ -std=c++14 -Isampesp/tests/host sampesp/tests/log_test.cpp -pthread -o /tmp/sampesp-log-test
          /tmp/sampesp-log-test
          g++ -std=c++14 -D__aarch64__ -Isampesp/tests/host -I. sampesp/tests/features_test.cpp -ldl -pthread -o /tmp/sampesp-features-test
          /tmp/sampesp-features-test
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'ndk;27.2.12479018'
      - name: Configure
        run: >-
          cmake -S sampesp -B build-sampesp
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-23
          -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-sampesp --parallel 2
      - uses: actions/upload-artifact@v4
        with:
          name: SA-MP-ESP-ARM64
          path: build-sampesp/libsampesp.so
          if-no-files-found: error
